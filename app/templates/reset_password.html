<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="p-4">
  <div class="container" style="max-width:520px;">
    {% if invalid %}
      <div class="alert alert-danger">This reset link is invalid or has expired.</div>
      <a href="{{ url_for('user.login') }}" class="btn btn-secondary">Back to login</a>
    {% else %}
      <h3 class="mb-3">Choose a new password</h3>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="form-group">
          <label>New password</label>
          <input class="form-control" type="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input class="form-control" type="password" name="confirm" required minlength="8">
        </div>
        <button class="btn btn-primary">Update password</button>
        <a href="{{ url_for('user.login') }}" class="btn btn-link">Back to login</a>
      </form>
    {% endif %}
  </div>
</body>
</html>
