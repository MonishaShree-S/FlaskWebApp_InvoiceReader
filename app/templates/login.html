<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        <img src="{{ url_for('static', filename='images/LOGO_SiranthaRechnunSplit.jpg') }}" alt="Logo" class="login-logo">

        <h2>Login</h2>
        <form id="login-form" action="{{ url_for('user.login') }}" method="POST">

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="{{ url_for('user.register') }}">Register here</a>.</p>
        <p><a href="#" data-toggle="modal" data-target="#forgotPasswordModal">Forgot password?</a></p>
    </div>
    <!-- Login Error Modal -->
    <div class="modal fade" id="loginErrorModal" tabindex="-1" role="dialog" aria-labelledby="loginErrorModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="loginErrorModalLabel">Login Failed</h5>
            <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body" id="login-error-message">
            <!-- Error message will go here -->
          </div>
        </div>
      </div>
    </div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" role="dialog" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="forgotPasswordModalLabel">Reset your password</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="forgot-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="forgot-username">Email / Username</label>
            <input type="email" class="form-control" id="forgot-username" name="username" placeholder="you@example.com" required>
            <small class="form-text text-muted">We’ll email you a reset link if the account exists.</small>
          </div>
          <div id="forgot-status" class="text-danger small" style="display:none;"></div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </div>
      </form>
    </div>
  </div>
</div>

     <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <script>
document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const formData = new URLSearchParams(new FormData(this)).toString();

    fetch("/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-Requested-With": "XMLHttpRequest"
        },
        body: formData
    })
    .then(async response => {
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            const data = await response.json();

            if (response.status === 401 && data.warning) {
                document.getElementById("login-error-message").textContent = data.warning;
                $('#loginErrorModal').modal('show');
            } else if (response.ok && data.redirect) {
                window.location.href = data.redirect;
            } else if (data.error) {
                document.getElementById("login-error-message").textContent = data.error;
                $('#loginErrorModal').modal('show');
            }
        } else {
            // fallback: redirect if HTML page returned
            window.location.href = "/index";
        }
    })
    .catch(error => {
        console.error("Login error:", error);
        document.getElementById("login-error-message").textContent = "A network error occurred.";
        $('#loginErrorModal').modal('show');
    });
});

    document.getElementById("forgot-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const status = document.getElementById("forgot-status");
      status.style.display = "none";

      const formData = new URLSearchParams(new FormData(this)).toString();

      try {
        const res = await fetch("{{ url_for('user.forgot_password') }}", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-Requested-With": "XMLHttpRequest"
          },
          body: formData
        });
        const data = await res.json();
        if (data.redirect) {
          window.location.href = data.redirect; // go straight to reset form
        } else {
          status.textContent = data.error || "Something went wrong.";
          status.style.display = "block";
        }
      } catch {
        status.textContent = "Network error.";
        status.style.display = "block";
      }
    });



</script>

</body>
</html>
